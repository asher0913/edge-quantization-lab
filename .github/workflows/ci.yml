name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Benchmark reproduces the committed integer-kernel result
        run: |
          edge-quant benchmark --seeds 5 --out /tmp/benchmark.json
          python - <<'PY'
          import json
          fresh = json.load(open("/tmp/benchmark.json"))["integer_kernel"]
          committed = json.load(open("results/benchmark.json"))["integer_kernel"]
          assert fresh["top1_agreement_with_simulation"] == committed["top1_agreement_with_simulation"] == 1.0
          assert fresh["max_code_difference_lsb"] <= 1
          print("integer kernel check passed", fresh)
          PY
