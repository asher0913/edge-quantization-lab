[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-quantization-lab"
version = "1.0.0"
description = "Post-training quantization from scratch: INT8/INT4, per-channel scales, calibration observers, sensitivity-driven mixed precision and a bit-exact integer-only kernel."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
edge-quant = "edge_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
