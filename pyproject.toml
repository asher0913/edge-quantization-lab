[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-quantization-lab"
version = "0.1.0"
description = "A dependency-free mixed-precision quantization workbench that measures layer sensitivity, reconstruction error, latency, and model-size trade-offs before edge deployment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Asher"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["edge_quantization_lab*"]
